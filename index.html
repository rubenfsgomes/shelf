<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Shelf</title>
  <meta name="theme-color" content="#1b1d24" />
  <meta name="description" content="Set a thought down. Get one back when you're free." />

  <!-- installable / iOS home-screen -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" type="image/png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Shelf" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />

  <style>
    /* ---- design tokens: "dusk / lamplight" ---- */
    :root {
      --bg: #1b1d24;         /* deep blue-slate ground */
      --bg-lift: #23262f;    /* raised surface */
      --bg-lift-2: #272b36;  /* one step further up — disabled/idle fills */
      --ink: #e9e6df;        /* warm paper ink */
      --ink-dim: #9a9ca6;    /* muted, for labels/secondary */
      --ink-faint: #848a97;  /* hairlines, placeholders — 4.9:1 on bg, still muted */
      --lamp: #e0a45c;       /* the one warm accent — used with restraint */
      --lamp-dim: #c88f4e;   /* lamp's shadow side, for gradients */
      --lamp-glow: rgba(224, 164, 92, 0.14);
      --radius: 18px;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      /* respect the notch, keep content off the edges */
      padding:
        env(safe-area-inset-top) env(safe-area-inset-right)
        env(safe-area-inset-bottom) env(safe-area-inset-left);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    #app { max-width: 34rem; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }

    /* ---- top bar ---- */
    .bar { display: flex; align-items: center; justify-content: space-between; padding: 1.15rem 1.25rem; }
    .wordmark { font-family: var(--serif); font-size: 1.15rem; letter-spacing: 0.01em; color: var(--ink); }
    .wordmark .dot { color: var(--lamp); }
    .toggle { display: inline-flex; gap: 0.15rem; background: var(--bg-lift); border-radius: 999px; padding: 0.2rem; }
    .toggle button {
      font: inherit; font-size: 0.82rem; color: var(--ink-dim);
      background: transparent; border: 0; border-radius: 999px;
      padding: 0.4rem 0.85rem; cursor: pointer; transition: color 0.2s, background 0.2s;
    }
    .toggle button[aria-selected="true"] { color: var(--bg); background: var(--ink); }

    /* ---- shared stage ---- */
    main { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; padding: 9vh 1.25rem 2.5rem; }
    .rise { animation: rise 0.5s var(--ease) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* ---- capture view ---- */
    .capture label { display: block; font-size: 0.8rem; color: var(--ink-dim); margin-bottom: 0.9rem; }
    .field {
      position: relative;
      background: linear-gradient(180deg, var(--bg-lift), var(--bg));
      border-radius: 16px;
      padding: 1.15rem 1.2rem;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03), inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }
    .field::after {
      content: ""; position: absolute; left: 1.2rem; right: 1.2rem; bottom: 0.7rem; height: 2px;
      background: var(--ink-faint); opacity: 0.35; border-radius: 2px;
      transition: background 0.2s, opacity 0.2s, box-shadow 0.2s;
    }
    .field:focus-within::after { background: var(--lamp); opacity: 1; box-shadow: 0 0 12px var(--lamp-glow); }
    #entry {
      display: block; width: 100%; min-height: 7rem; max-height: 45vh; overflow-y: auto;
      resize: none; background: transparent; border: 0; outline: none;
      color: var(--ink); font-family: var(--serif); font-size: 1.35rem; line-height: 1.5;
      padding-bottom: 0.6rem;
    }
    #entry::placeholder { color: var(--ink-faint); }

    .primary {
      margin-top: 1.1rem; width: 100%; min-height: 3.35rem;
      font: inherit; font-size: 1rem; font-weight: 600; color: #241a0e;
      background: linear-gradient(180deg, #ecb572, var(--lamp)); border: 0; border-radius: 14px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.25) inset, 0 8px 20px -8px rgba(224, 164, 92, 0.55);
      cursor: pointer; transition: filter 0.2s, transform 0.05s, box-shadow 0.2s, background 0.2s;
    }
    .primary:active { transform: translateY(1px); }
    .primary:disabled { background: var(--bg-lift-2); color: var(--ink-faint); box-shadow: none; cursor: default; }
    @media (hover: hover) and (pointer: fine) {
      .primary:not(:disabled):hover { filter: brightness(1.08); }
    }
    .capture-foot { margin-top: 1.5rem; display: flex; justify-content: space-between; align-items: center; color: var(--ink-dim); font-size: 0.85rem; }
    .linkish { font: inherit; color: var(--lamp); background: 0; border: 0; cursor: pointer; padding: 0.3rem 0; }
    @media (hover: hover) and (pointer: fine) {
      .linkish:hover, .toggle button:not([aria-selected="true"]):hover { color: var(--ink); }
    }

    /* ---- surface view: the thought gets a real object to sit in ---- */
    .card-drag { touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; will-change: transform; }
    .card-drag.dragging { cursor: grabbing; }
    .card {
      position: relative;
      background: linear-gradient(165deg, #262a35, #20232c);
      border-radius: 26px;
      padding: 2.5rem 1.75rem 2rem;
      box-shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    .card::before {
      content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 44px; height: 4px; border-radius: 0 0 6px 6px;
      background: linear-gradient(180deg, var(--lamp), var(--lamp-dim));
    }
    .card-thought { font-family: var(--serif); font-size: 1.65rem; line-height: 1.48; color: var(--ink); text-align: center; }
    .card-meta { margin-top: 1.3rem; text-align: center; font-size: 0.72rem; color: var(--ink-faint); letter-spacing: 0.03em; }
    .actions { margin-top: 2.25rem; display: flex; flex-direction: column; gap: 0.6rem; }
    .act {
      font: inherit; font-size: 1rem; min-height: 3.1rem;
      background: transparent; color: var(--ink); border: 0; border-radius: 15px;
      cursor: pointer; transition: background 0.2s, filter 0.2s, color 0.2s, border-color 0.2s;
    }
    .act.did {
      color: #241a0e; font-weight: 600;
      background: linear-gradient(180deg, #ecb572, var(--lamp));
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.25) inset, 0 8px 20px -8px rgba(224, 164, 92, 0.5);
    }
    .act.later { border: 1.5px solid rgba(255, 255, 255, 0.12); }
    .act.later:active { background: rgba(255, 255, 255, 0.04); }
    .act.letgo { color: var(--ink-faint); font-size: 0.92rem; min-height: 2.6rem; } /* calm, not alarm */
    @media (hover: hover) and (pointer: fine) {
      .act.later:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.2); }
      .act.did:hover { filter: brightness(1.08); }
      .act.letgo:hover { color: var(--ink-dim); }
    }

    /* ---- rest / empty states: an invitation, not a dead-end ---- */
    .rest { text-align: center; }
    .rest h2 { font-family: var(--serif); font-weight: 500; font-size: 1.5rem; margin-bottom: 0.5rem; }
    .rest p { color: var(--ink-dim); font-size: 0.95rem; margin-bottom: 2rem; }
    .rest .primary { max-width: 20rem; margin-inline: auto; }
    .rest .linkish { display: block; margin: 1rem auto 0; }

    /* ---- undo toast ---- */
    .toast {
      position: fixed; left: 50%; bottom: calc(1.5rem + env(safe-area-inset-bottom));
      transform: translateX(-50%); z-index: 20;
      display: flex; align-items: center; gap: 0.7rem;
      background: var(--bg-lift); color: var(--ink);
      border-radius: 999px; padding: 0.6rem 0.55rem 0.6rem 1.15rem;
      font-size: 0.88rem; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      opacity: 0; animation: toast-in 0.25s var(--ease) forwards;
    }
    .toast.leaving { animation: toast-out 0.2s var(--ease) forwards; }
    .toast .undo { font: inherit; font-weight: 600; color: var(--lamp); background: transparent; border: 0; cursor: pointer; padding: 0.3rem 0.7rem; }
    @keyframes toast-in { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes toast-out { to { opacity: 0; transform: translateX(-50%) translateY(8px); } }

    :focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; } * { transition: none !important; } .toast { animation: none; opacity: 1; } }
  </style>
</head>
<body>
  <div id="app">
    <header class="bar">
      <span class="wordmark">shelf<span class="dot">.</span></span>
      <div class="toggle" role="tablist" aria-label="Mode">
        <button id="tab-capture" role="tab" aria-selected="true">Capture</button>
        <button id="tab-surface" role="tab" aria-selected="false">Surface</button>
      </div>
    </header>
    <main id="stage" aria-live="polite"></main>
  </div>

  <script type="module" src="./app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () =>
        navigator.serviceWorker.register("./sw.js").catch(() => {}),
      );
    }
  </script>
</body>
</html>
